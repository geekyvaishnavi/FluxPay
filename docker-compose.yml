services:
  postgres:
    image: postgres:16-alpine
    container_name: FluxPay-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-FluxPay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-FluxPay}
      POSTGRES_DB: ${POSTGRES_DB:-FluxPay}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - FluxPay_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-FluxPay} -d ${POSTGRES_DB:-FluxPay}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: FluxPay-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-FluxPay}:${POSTGRES_PASSWORD:-FluxPay}@postgres:5432/${POSTGRES_DB:-FluxPay}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app
    volumes:
      - ./backend:/app

volumes:
  FluxPay_postgres_data:
