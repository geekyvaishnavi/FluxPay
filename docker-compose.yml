services:
  postgres:
    image: postgres:16-alpine
    container_name: revive-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-revive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-revive}
      POSTGRES_DB: ${POSTGRES_DB:-revive}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - revive_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-revive} -d ${POSTGRES_DB:-revive}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: revive-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-revive}:${POSTGRES_PASSWORD:-revive}@postgres:5432/${POSTGRES_DB:-revive}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app
    volumes:
      - ./backend:/app

volumes:
  revive_postgres_data:
